# E2 MedAgentSim reproduction: ungated self-evolving memory + chain of thought.
# The paper's multi-doctor majority-vote ensembling is SKIPPED for cost; that
# reduction is recorded in docs/devlog_G3.md.
# The `agents` block is injected by experiments/run_consultation.py from --providers.
run_name: consultation_e2
dataset: data/processed/medqa_test.jsonl
max_turns: 20
workers: 1          # REQUIRED: one memory is shared across a run, so order matters
judge_method: llm
features:
  memory: ungated
  safety: none
  cot: true
  ask_plan: false
  memory_k: 3
