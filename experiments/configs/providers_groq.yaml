# Shared provider definitions (Groq free tier). Experiment configs reference these roles.
_groq: &groq
  provider: openai_compat
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  extra_body: {reasoning_effort: low}

agents:
  doctor:        {<<: *groq, model: openai/gpt-oss-120b, temperature: 0.2, max_tokens: 1024}
  triage_nurse:  {<<: *groq, model: openai/gpt-oss-120b, temperature: 0.2, max_tokens: 700}
  safety_officer: {<<: *groq, model: openai/gpt-oss-120b, temperature: 0.0, max_tokens: 900}
  judge:         {<<: *groq, model: openai/gpt-oss-120b, temperature: 0.0, max_tokens: 256}
  patient:       {<<: *groq, model: openai/gpt-oss-20b, temperature: 0.2, max_tokens: 700}
  measurement:   {<<: *groq, model: openai/gpt-oss-20b, temperature: 0.0, max_tokens: 512}
