[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medsim"
version = "0.1.0"
description = "MedAgentSim re-implementation: multi-agent doctor/patient/measurement clinic simulation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "openai>=1.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
