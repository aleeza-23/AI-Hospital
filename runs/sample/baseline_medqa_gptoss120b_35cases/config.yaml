run_name: baseline_medqa_gptoss120b
dataset: data/processed/medqa.jsonl
num_cases: null
max_turns: 20
workers: 1
output_dir: runs
judge_method: llm
agents:
  doctor:
    provider: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-120b
    extra_body:
      reasoning_effort: low
    temperature: 0.2
    max_tokens: 1024
  patient:
    provider: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-20b
    extra_body:
      reasoning_effort: low
    temperature: 0.2
    max_tokens: 512
  measurement:
    provider: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-20b
    extra_body:
      reasoning_effort: low
    temperature: 0.0
    max_tokens: 512
  judge:
    provider: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: openai/gpt-oss-120b
    extra_body:
      reasoning_effort: low
    temperature: 0.0
    max_tokens: 256
